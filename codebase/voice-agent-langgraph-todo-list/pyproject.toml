[project]
name = "voice-agent-langgraph-todo-list"
version = "0.1.0"
description = "Voice-driven LangGraph todo assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ahamed Nishath" },
]
license = "Proprietary"
dependencies = [
    "fastapi>=0.120.0",
    "langchain>=1.3.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
    "uvicorn>=0.38.0",
    "websockets>=16.0",
    "websocket-client>=1.9.0",
]

[project.scripts]
voice-todo = "voice_agent_todo.cli:main"
voice-todo-ui = "voice_agent_todo.web_ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
